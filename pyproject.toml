[project]
name = "xmagic-sdk"
version = "0.1.0"
description = "Python SDK and CLI for xMagic, Stochastic's AI agent platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Stochastic" }]
keywords = ["xmagic", "ai", "agents", "mcp", "llm", "sdk", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.34"]
google = ["google-genai>=1.0"]
litellm = ["litellm>=1.40"]
serve = ["starlette>=0.37", "uvicorn>=0.29"]
mcp = ["mcp>=1.0"]
all = [
    "xmagic-sdk[openai,anthropic,google,litellm,serve,mcp]",
]

[project.scripts]
xmagic = "xmagic.cli.main:app"

[project.entry-points."xmagic.providers"]
xmagic = "xmagic.providers.xmagic:XMagicProvider"
openai = "xmagic.providers.openai:OpenAIProvider"
anthropic = "xmagic.providers.anthropic:AnthropicProvider"
google = "xmagic.providers.google:GoogleProvider"
litellm = "xmagic.providers.litellm:LiteLLMProvider"

[project.urls]
Documentation = "https://docs.xmagic.ai"
Homepage = "https://xmagic.ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xmagic"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

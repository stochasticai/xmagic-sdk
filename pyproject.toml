[project]
name = "xmagic-sdk"
version = "0.2.0"
description = "Python SDK and CLI for xMagic, Stochastic's AI agent platform"
readme = "README.md"
# Upper bound is deliberate. An unbounded ">=3.11" forces resolvers to find a
# version of every dependency that supports *all* future Pythons; litellm caps
# each release (<3.15 as of 1.93.0), so nothing satisfies it and resolution
# silently degrades to an old, incompatible pin. Raise this as we test newer.
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Stochastic" }]
keywords = ["xmagic", "ai", "agents", "mcp", "llm", "sdk", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# One vendor extra, for the one implemented vendor adapter. The Anthropic and
# Google adapters are reserved extension points whose `complete`/`stream` raise
# NotImplementedError, so `[anthropic]` / `[google]` would install heavy SDKs
# that nothing imports — LiteLLM already reaches those vendors. Add an extra
# next to whichever adapter is actually implemented, as `[openai]` is here.
openai = ["openai>=1.30"]
litellm = ["litellm>=1.40"]
serve = ["starlette>=0.37", "uvicorn>=0.29"]
# Bounded to one major: mcp 2.0 relocated FastMCP, which broke the generated
# server template while the unbounded range still resolved "successfully".
mcp = ["mcp>=2.0,<3"]
all = [
    "xmagic-sdk[openai,litellm,serve,mcp]",
]

[project.scripts]
xmagic = "xmagic.cli.main:app"

[project.entry-points."xmagic.providers"]
xmagic = "xmagic.providers.xmagic:XMagicProvider"
openai = "xmagic.providers.openai:OpenAIProvider"
anthropic = "xmagic.providers.anthropic:AnthropicProvider"
google = "xmagic.providers.google:GoogleProvider"
litellm = "xmagic.providers.litellm:LiteLLMProvider"

[project.urls]
Documentation = "https://docs.xmagic.ai"
Homepage = "https://xmagic.ai"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `xmagic_sdk` is a shim, not a package: releases 0.0.1-0.0.3 of this same
# distribution installed a top-level `xmagic_sdk`, so an in-place upgrade would
# otherwise turn `import xmagic_sdk` into a bare ModuleNotFoundError. Remove in 1.0.
packages = ["src/xmagic", "src/xmagic_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "src",
    "tests",
    "examples",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "CODE_OF_CONDUCT.md",
    "COMMIT_GUIDELINES.md",
    "ISSUES.md",
    "DESIGN.md",
    "CITATION.cff",
]

[dependency-groups]
dev = [
    # Bounded to one minor for the same reason as ruff: mypy adds checks in
    # minor releases, so an unbounded range lets CI enforce rules a contributor's
    # environment has never heard of.
    "mypy>=2.3,<2.4",
    "pytest>=8.0",
    "pytest-asyncio>=1.0,<2",
    "respx>=0.21",
    # Bounded to one minor: ruff changes rule defaults and formatting between
    # minors, and with no committed lock an unbounded range lets CI drift ahead
    # of contributors' environments.
    "ruff>=0.16,<0.17",
    "types-pyyaml",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Selected explicitly rather than inheriting ruff's built-in defaults. Those
# defaults widened in ruff 0.16, which turned CI red against a green local run
# purely because the two resolved different ruff versions. Pinning the rule set
# here means a ruff upgrade can change fix behavior but never silently change
# which rules are enforced.
select = ["E4", "E7", "E9", "F", "B", "BLE", "PYI", "RUF", "UP"]

[tool.ruff.lint.per-file-ignores]
# Typer's API requires `typer.Option()` / `typer.Argument()` as parameter
# defaults, so B008 fires on every command it defines. Not a real finding here.
"src/xmagic/cli/*" = ["B008"]

[tool.mypy]
# Deliberately no `python_version` pin: mypy checks against whichever
# interpreter runs it, and CI runs it across the whole 3.11-3.14 matrix, so a
# construct that only type-checks on newer Pythons fails on the 3.11 entry.
# `src` only. That is the shipped package, and since `py.typed` went out every
# annotation in it is a promise to consumers' type checkers -- a wrong one is
# worse for them than none at all. `tests/` is not checked yet: it needs ~50
# fixes of its own, tracked in TODO.md, and gating on them now would have held
# up the check that actually protects consumers.
files = ["src"]
strict = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
# Optional extras that are not installed in the checking environment. The
# adapters guard each import and raise a pointed ImportError; `anthropic` and
# `google` are reserved extension points with no extra at all (DESIGN.md §4).
module = ["anthropic.*", "google.*", "litellm.*", "httpx_sse.*", "httpx2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
# Async tests are plain `async def` without a per-test decorator.
asyncio_mode = "auto"
markers = [
    "live: tests that hit the live xMagic backend",
]

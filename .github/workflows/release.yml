name: Release

# Publishes to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token secrets. One-time setup on
# PyPI (Your projects -> xmagic-sdk -> Publishing, or a pending publisher if the
# project does not exist yet):
#
#   Owner:            stochasticai
#   Repository name:  xmagic-sdk
#   Workflow name:    release.yml
#   Environment name: pypi
#
# Then create a GitHub environment named `pypi` on this repo.
#
# To cut a release: bump `version` in pyproject.toml, commit, tag `vX.Y.Z`, and
# publish a GitHub Release for that tag. The version check below fails the run if
# the tag and pyproject.toml disagree.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify tag matches pyproject version
        if: github.event_name == 'release'
        run: |
          project_version="$(uv version --short)"
          tag_version="${GITHUB_REF_NAME#v}"
          echo "pyproject: $project_version | tag: $tag_version"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject version $project_version"
            exit 1
          fi

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xmagic-sdk
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

name: Release

# Publishes to PyPI when a GitHub Release is published.
#
# Uses PyPI Trusted Publishing (OIDC) — no API token secrets. One-time setup on
# PyPI (Your projects -> xmagic-sdk -> Publishing, or a pending publisher if the
# project does not exist yet):
#
#   Owner:            stochasticai
#   Repository name:  xmagic-sdk
#   Workflow name:    release.yml
#   Environment name: pypi
#
# Then create a GitHub environment named `pypi` on this repo.
#
# To cut a release: bump `version` in pyproject.toml, commit, tag `vX.Y.Z`, and
# publish a GitHub Release for that tag. The version check below fails the run if
# the tag and pyproject.toml disagree.
#
# For a manual recovery publish, enter the version without the leading `v`. The
# workflow checks out the existing `vX.Y.Z` tag and applies the same validation.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish without the leading v (for example, 0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out published release tag
        if: github.event_name == 'release'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out manually requested release tag
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v5
        with:
          ref: v${{ inputs.version }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Verify release tag and package version
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          release_version="${REQUESTED_VERSION#v}"
          expected_tag="v${release_version}"
          project_version="$(uv version --short)"

          if ! git rev-parse --verify --quiet "refs/tags/${expected_tag}" >/dev/null; then
            echo "::error::Release tag ${expected_tag} does not exist"
            exit 1
          fi

          tag_commit="$(git rev-list -n 1 "${expected_tag}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "${tag_commit}" != "${head_commit}" ]; then
            echo "::error::Checked-out commit does not match release tag ${expected_tag}"
            exit 1
          fi

          if [ "${project_version}" != "${release_version}" ]; then
            echo "::error::Tag ${expected_tag} does not match pyproject version ${project_version}"
            exit 1
          fi

      - name: Sync dependencies
        run: uv sync --all-extras

      - name: Lint and format
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Build sdist and wheel
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xmagic-sdk
    permissions:
      id-token: write # required for trusted publishing
    steps:
      - name: Download built dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      # Rehearse on TestPyPI with the exact bytes PyPI is about to receive. The
      # one historical rehearsal (0.0.2, Nov 2025) built its own sdist -- 28,934
      # bytes against PyPI's 28,947 -- so it never rehearsed what shipped.
      #
      # Never blocks the release: without a TestPyPI trusted publisher this step
      # fails, and a missing rehearsal is not a reason to withhold a good build.
      # Configure one at https://test.pypi.org/manage/project/xmagic-sdk/settings/publishing/
      - name: Publish to TestPyPI (rehearsal)
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1

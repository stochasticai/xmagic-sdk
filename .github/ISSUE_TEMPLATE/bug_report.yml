name: Bug report
description: Something in the SDK or CLI doesn't work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please search
        [existing issues](https://github.com/stochasticai/xmagic-sdk/issues?q=is%3Aissue)
        first, and redact any API keys or other secrets from the output you paste.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: The smallest CLI command or Python snippet that triggers the bug.
      render: shell
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Traceback or output
      description: Paste the full error, with secrets redacted.
      render: shell

  - type: input
    id: version
    attributes:
      label: xmagic-sdk version
      description: Output of `xmagic --version` (or the version you installed).
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.12.4"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15.1 / Ubuntu 24.04 / Windows 11"
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Which provider were you using, if any?
      options:
        - Not provider-specific
        - xmagic
        - openai
        - anthropic
        - google
        - litellm
      default: 0

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Workarounds you found, related issues, or other context.
